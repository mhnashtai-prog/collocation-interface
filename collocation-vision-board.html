<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>INTUITY: Collocation Vision Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      margin: 0;
      background: #0d0d0d;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.75rem;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow-x: hidden;
    }

    .background {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 30% 20%, rgba(201, 169, 97, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 70% 80%, rgba(201, 169, 97, 0.06) 0%, transparent 45%),
                  #0d0d0d;
      z-index: 0;
    }

    .container {
      max-width: 1200px;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 0;
      margin-bottom: 0.5rem;
      gap: 1rem;
    }
    
    .nav-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .nav-link {
      color: #8e8e93;
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: color 0.3s ease;
      white-space: nowrap;
    }
    
    .nav-link:hover {
      color: #C9A961;
    }
    
    .nav-center {
      flex: 1;
      text-align: center;
    }
    
    .nav-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #C9A961;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #C9A961 0%, rgba(201, 169, 97, 0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    header {
      text-align: center;
      margin-bottom: 1.5rem;
      padding: 0.5rem 0 0.25rem;
    }
    
    .subtitle {
      font-size: 0.75rem;
      color: #8e8e93;
      margin-bottom: 0.25rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    
    .author {
      font-size: 0.625rem;
      color: #636366;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    /* BOARD SELECTOR */
    .board-selector {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      padding: 1rem;
      background: rgba(28, 28, 30, 0.6);
      border-radius: 1rem;
      border: 1px solid rgba(201, 169, 97, 0.15);
    }

    .board-btn {
      padding: 0.5rem 1.25rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: #636366;
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 600;
      transition: all 0.2s ease;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-family: 'Space Grotesk', sans-serif;
    }

    .board-btn:hover {
      color: #C9A961;
      border-bottom-color: rgba(201, 169, 97, 0.5);
    }

    .board-btn.active {
      color: #C9A961;
      border-bottom-color: #C9A961;
    }

    /* VISION BOARD CONTAINER */
    .vision-board-wrapper {
      perspective: 1000px;
      margin-bottom: 2rem;
    }

    .vision-board-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 600px;
      margin: 0 auto;
      background: rgba(28, 28, 30, 0.85);
      backdrop-filter: blur(40px) saturate(150%);
      -webkit-backdrop-filter: blur(40px) saturate(150%);
      border-radius: 1.5rem;
      border: 1.5px solid rgba(201, 169, 97, 0.25);
      padding: 2rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 1.25rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    /* CONNECTING CIRCLE */
    .vision-board-container::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 75%;
      height: 75%;
      border: 1px dashed rgba(201, 169, 97, 0.15);
      border-radius: 50%;
      pointer-events: none;
      animation: rotate-circle 60s linear infinite;
    }

    @keyframes rotate-circle {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* CENTRAL WORD */
    .central-word {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, 
        rgba(201, 169, 97, 0.35) 0%, 
        rgba(201, 169, 97, 0.15) 100%);
      border: 2px solid #C9A961;
      border-radius: 1.25rem;
      box-shadow: 0 8px 32px rgba(201, 169, 97, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 10;
      animation: pulse-glow 4s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 8px 32px rgba(201, 169, 97, 0.4),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
      50% {
        box-shadow: 0 8px 40px rgba(201, 169, 97, 0.6),
                    0 0 60px rgba(201, 169, 97, 0.3),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }
    }

    .word-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.75rem;
      font-weight: 700;
      color: #C9A961;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 2px 20px rgba(201, 169, 97, 0.5);
    }

    /* COLLOCATION BOXES */
    .collocation-box {
      background: rgba(48, 48, 51, 0.6);
      border: 1px solid rgba(84, 84, 88, 0.3);
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .collocation-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, 
        rgba(96, 165, 250, 0.1) 0%, 
        transparent 100%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .collocation-box:hover {
      background: rgba(60, 165, 250, 0.15);
      border-color: rgba(96, 165, 250, 0.6);
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 8px 30px rgba(96, 165, 250, 0.4);
    }

    .collocation-box:hover::before {
      opacity: 1;
    }

    .collocation-box:active {
      transform: translateY(-2px) scale(1.01);
    }

    /* COLLOCATION TEXT */
    .collocation {
      font-size: 1rem;
      font-weight: 600;
      color: #e5e5e7;
      letter-spacing: 0.02em;
      transition: color 0.3s ease;
      text-align: center;
      line-height: 1.4;
      position: relative;
      z-index: 1;
    }

    .collocation-box:hover .collocation {
      color: #60a5fa;
    }

    /* ARROWS */
    .arrow {
      font-size: 1.75rem;
      color: #C9A961;
      font-weight: 700;
      transition: all 0.3s ease;
      line-height: 1;
      position: relative;
      z-index: 1;
    }

    .collocation-box:hover .arrow {
      transform: scale(1.3);
      color: #60a5fa;
      text-shadow: 0 0 20px rgba(96, 165, 250, 0.8);
    }

    /* POSITIONING */
    .top-left { grid-column: 1; grid-row: 1; }
    .top-center { grid-column: 2; grid-row: 1; }
    .top-right { grid-column: 3; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .right { grid-column: 3; grid-row: 2; }
    .bottom-left { grid-column: 1; grid-row: 3; }
    .bottom-center { grid-column: 2; grid-row: 3; }
    .bottom-right { grid-column: 3; grid-row: 3; }

    /* TOOLTIP */
    .collocation-box::after {
      content: attr(data-meaning);
      position: absolute;
      bottom: calc(100% + 1rem);
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(13, 13, 13, 0.98);
      border: 1px solid #C9A961;
      border-radius: 0.625rem;
      padding: 0.625rem 1rem;
      font-size: 0.75rem;
      color: #C9A961;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .collocation-box:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: rgba(28, 28, 30, 0.98);
      backdrop-filter: blur(60px);
      border: 1.5px solid rgba(201, 169, 97, 0.4);
      border-radius: 1.5rem;
      padding: 2.5rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
      animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      text-align: center;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(84, 84, 88, 0.3);
    }

    .modal-collocation {
      font-size: 1.75rem;
      font-weight: 700;
      color: #C9A961;
      margin-bottom: 0.5rem;
      font-family: 'Space Grotesk', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-central {
      font-size: 1.25rem;
      color: #60a5fa;
      font-weight: 600;
    }

    .modal-meaning {
      font-size: 1rem;
      color: #8e8e93;
      font-style: italic;
      margin-bottom: 1.5rem;
    }

    .modal-example {
      background: rgba(48, 48, 51, 0.4);
      border-left: 3px solid #60a5fa;
      border-radius: 0.75rem;
      padding: 1.25rem;
      font-size: 1.125rem;
      color: #e5e5e7;
      line-height: 1.7;
      margin-bottom: 1.25rem;
    }

    .modal-example strong {
      color: #C9A961;
      font-weight: 700;
    }

    .formality-badge {
      display: inline-block;
      padding: 0.375rem 1rem;
      background: rgba(96, 165, 250, 0.15);
      border: 1px solid rgba(96, 165, 250, 0.3);
      border-radius: 0.5rem;
      color: #60a5fa;
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-close {
      margin-top: 2rem;
      padding: 0.875rem 2rem;
      background: rgba(99, 99, 102, 0.25);
      border: 1px solid rgba(99, 99, 102, 0.3);
      border-radius: 0.75rem;
      color: #aeaeb2;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .modal-close:hover {
      background: rgba(99, 99, 102, 0.35);
      color: #e5e5e7;
      border-color: rgba(99, 99, 102, 0.5);
    }

    .loading {
      text-align: center;
      padding: 4rem;
      color: #8e8e93;
      font-size: 1rem;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .vision-board-container {
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 1rem;
        padding: 1.5rem;
      }

      .central-word {
        grid-column: 1;
        grid-row: 1;
        padding: 2rem;
      }

      .word-text {
        font-size: 2rem;
      }

      .collocation-box {
        grid-column: 1 !important;
        grid-row: auto !important;
      }

      .vision-board-container::before {
        display: none;
      }

      .modal {
        padding: 1.5rem;
      }

      .modal-collocation {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="background"></div>
  
  <div class="container">
    <div class="top-nav">
      <div class="nav-left">
        <a href="#" class="nav-link">← Back</a>
      </div>
      <div class="nav-center">
        <div class="nav-title">INTUITY</div>
      </div>
    </div>
    
    <header>
      <p class="subtitle">Visual Collocation System</p>
      <p class="author">Majid Nashtai · B2 First Collocations</p>
    </header>

    <div class="board-selector" id="boardSelector">
      <div class="loading">Loading boards...</div>
    </div>

    <div class="vision-board-wrapper">
      <div class="vision-board-container" id="visionBoard">
        <div class="loading">Loading collocation board...</div>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="exampleModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-central" id="modalCentral"></div>
        <div class="modal-collocation" id="modalCollocation"></div>
        <div class="modal-meaning" id="modalMeaning"></div>
      </div>
      <div class="modal-example" id="modalExample"></div>
      <span class="formality-badge" id="modalFormality"></span>
      <button class="modal-close" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    let boardsData = [];
    let currentBoardIndex = 0;

    async function loadData() {
      try {
        const response = await fetch('collocation-boards-data.json');
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        boardsData = data.visionBoards;
        
        renderBoardSelector();
        renderBoard(0);
        
      } catch (error) {
        console.error('Error loading data:', error);
        document.getElementById('visionBoard').innerHTML = `
          <div class="loading" style="color: #fb923c;">
            ⚠️ Failed to load data<br>
            <span style="font-size: 0.75rem;">${error.message}</span>
          </div>
        `;
      }
    }

    function renderBoardSelector() {
      const selector = document.getElementById('boardSelector');
      let html = '';
      
      boardsData.forEach((board, index) => {
        html += `
          <button class="board-btn ${index === currentBoardIndex ? 'active' : ''}" 
                  onclick="renderBoard(${index})">
            ${board.centralWord}
          </button>
        `;
      });
      
      selector.innerHTML = html;
    }

    function renderBoard(index) {
      currentBoardIndex = index;
      const board = boardsData[index];
      const container = document.getElementById('visionBoard');
      
      // Update selector
      document.querySelectorAll('.board-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === index);
      });
      
      let html = `
        <div class="central-word">
          <span class="word-text">${board.centralWord}</span>
        </div>
      `;
      
      board.collocations.forEach((collocation, idx) => {
        const arrowLeft = collocation.position.includes('left') || collocation.position === 'left';
        const arrowRight = collocation.position.includes('right') || collocation.position === 'right';
        
        html += `
          <div class="collocation-box ${collocation.position}" 
               data-meaning="${collocation.meaning}"
               onclick='showExample(${JSON.stringify(collocation).replace(/'/g, "&#39;")}, "${board.centralWord}")'>
            ${arrowLeft ? '<span class="arrow">→</span>' : ''}
            <span class="collocation">${collocation.text}</span>
            ${arrowRight ? '<span class="arrow">←</span>' : ''}
          </div>
        `;
      });
      
      container.innerHTML = html;
    }

    function showExample(collocation, centralWord) {
      const modal = document.getElementById('exampleModal');
      
      document.getElementById('modalCentral').textContent = centralWord;
      document.getElementById('modalCollocation').textContent = collocation.text;
      document.getElementById('modalMeaning').textContent = collocation.meaning;
      document.getElementById('modalExample').innerHTML = collocation.example.replace(
        new RegExp(`${centralWord}\\s+${collocation.text}`, 'gi'),
        `<strong>${centralWord} ${collocation.text}</strong>`
      );
      document.getElementById('modalFormality').textContent = collocation.formality;
      
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('exampleModal').classList.remove('active');
    }

    document.getElementById('exampleModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    window.addEventListener('load', loadData);
  </script>
</body>
</html>
